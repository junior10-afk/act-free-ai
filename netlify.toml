[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # decap-cms est une devDependency, et le hook prebuild (scripts/sync-cms.mjs)
  # recopie son bundle dans public/admin/cms/. Si npm omet les devDependencies
  # (ce qui arrive quand NODE_ENV=production), la copie echoue et le build
  # s'arrete. On force donc leur installation.
  NPM_FLAGS = "--include=dev"

# ---------------------------------------------------------------------------
# Fonctions serverless
#
# Le proxy OAuth de Decap CMS vit ici : netlify/functions/auth.mjs (redirection
# vers GitHub) et callback.mjs (echange du code contre un jeton). Le routage
# est declare par `export const config = { path: ... }` dans chaque fichier,
# aucun redirect n'est necessaire.
#
# Identifiants a definir dans Site configuration > Environment variables :
#   GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET, SITE_URL
# ---------------------------------------------------------------------------
[functions]
  directory = "netlify/functions"

# ---------------------------------------------------------------------------
# En-têtes de sécurité globaux
#
# La Content-Security-Policy n'est PAS définie ici : Astro la génère lui-même
# en calculant les hachages de ses scripts et styles inline (voir
# `security.csp` dans astro.config.mjs), et l'injecte dans chaque page.
# La redéfinir ici l'affaiblirait en la fusionnant avec une version plus large.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"

# ---------------------------------------------------------------------------
# Interface d'administration
#
# Elle est exclue de l'indexation, jamais mise en cache, et volontairement
# privée de Content-Security-Policy : Decap CMS injecte ses styles à
# l'exécution et ouvre une fenêtre vers GitHub pour l'authentification, ce
# qu'une CSP stricte casserait. La protection repose sur l'authentification
# GitHub (seuls les comptes ayant un droit d'écriture sur le dépôt peuvent
# publier) et sur le fait que la page n'expose aucune donnée.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, max-age=0"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, max-age=0"

# ---------------------------------------------------------------------------
# Endpoints OAuth
#
# Jamais indexables, jamais mis en cache : une reponse de /callback contient
# un jeton d'acces GitHub valide.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/auth"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, max-age=0"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/callback"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, max-age=0"
    Referrer-Policy = "no-referrer"

# ---------------------------------------------------------------------------
# Cache des ressources versionnées produites par le build
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
